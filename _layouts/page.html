---
layout: default
---
<header class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow reveal">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="display reveal">{{ page.heading | default: page.title }}</h1>
    {% if page.lede %}<p class="lede reveal">{{ page.lede }}</p>{% endif %}
  </div>
</header>
<div class="page-body">
  {{ content }}
</div>
