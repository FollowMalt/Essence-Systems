title: Astra
subtitle: Your music. Your library. Every device.
c1: "#cdb6ff"
c2: "#FF6FAE"
glow: "rgba(155, 92, 255, .75)"
steps:
  - eyebrow: "01 · One master library"
    headline: "Every song you own, <em>finally together.</em>"
    text: "Import files, folders or CDs. Astra keeps the best-quality copy, skips duplicates and never touches your originals."
    ui: albums
    bg: "radial-gradient(70% 60% at 50% 100%, #3b1f7a, transparent 70%), radial-gradient(50% 50% at 15% 20%, #1d1450, transparent), #05060d"
    callouts:
      - { text: "Covers found for you", x: "30%", y: "28%" }
      - { text: "Cover colors on every card", x: "78%", y: "56%", c: "#FF6FAE" }
  - eyebrow: "02 · Artist pages"
    headline: "Every artist gets <em>a home of their own.</em>"
    text: "A full discography grouped into albums, EPs and singles, every song you have, and the artists they've worked with, all colored from their artwork."
    ui: artist
    bg: "radial-gradient(70% 60% at 50% 100%, #0f5a78, transparent 70%), radial-gradient(40% 40% at 85% 15%, #2a2470, transparent), #04070d"
    callouts:
      - { text: "Albums · EPs · Singles", x: "30%", y: "52%", c: "#48D7D0" }
      - { text: "Collaborators", x: "84%", y: "72%", c: "#48D7D0" }
  - eyebrow: "03 · Smart Library"
    headline: "It tidies up. <em>You stay in charge.</em>"
    text: "Missing info, wrong albums, duplicates and covers, all found and shown with evidence. Nothing changes until you press Apply."
    ui: smart
    z: 1.25
    x: "-8%"
    y: "6%"
    bg: "radial-gradient(70% 60% at 50% 100%, #2c2a8f, transparent 70%), radial-gradient(40% 40% at 85% 15%, #3a1b5f, transparent), #05060d"
    callouts:
      - { text: "98% verified", x: "86%", y: "26%" }
      - { text: "Every change can be undone", x: "42%", y: "72%", c: "#48D7D0" }
  - eyebrow: "04 · Now Playing"
    headline: "A player that <em>glows with the song.</em>"
    text: "Crossfade, volume leveling, a sleep timer, timed lyrics and now a 10-band EQ, wrapped in the colors of whatever's playing."
    ui: lyrics
    bg: "radial-gradient(70% 70% at 50% 90%, #0f6b78, transparent 70%), radial-gradient(40% 40% at 10% 10%, #1b3a6b, transparent), #04080d"
    callouts:
      - { text: "Crossfade 3–12 s", x: "26%", y: "86%", c: "#48D7D0" }
      - { text: "Lyrics that follow along", x: "82%", y: "14%", c: "#48D7D0" }
  - eyebrow: "05 · Astra Radio · New"
    headline: "Your playlists, <em>on the air.</em>"
    text: "Every playlist is a station on the FM dial, playing all day. Tune in and you join mid-song, on your computer, phone or TV."
    ui: radio
    bg: "radial-gradient(70% 60% at 50% 100%, #6b3a0f, transparent 70%), radial-gradient(40% 40% at 85% 15%, #3a1b5f, transparent), #07050d"
    callouts:
      - { text: "Tune in mid-song", x: "60%", y: "27%", c: "#ffb347" }
      - { text: "Every playlist is a station", x: "70%", y: "60%", c: "#ffb347" }
  - eyebrow: "06 · Walkman & iPod"
    headline: "Plug it in. <em>It just syncs.</em>"
    text: "Sony Walkmans and iPod shuffles get your playlists, converted to formats they can play. Astra only ever removes what it put there."
    ui: devices
    z: 1.15
    x: "-4%"
    y: "-4%"
    bg: "radial-gradient(70% 60% at 50% 100%, #7a1f52, transparent 70%), radial-gradient(40% 40% at 80% 10%, #2a2470, transparent), #07050d"
    callouts:
      - { text: "Auto-sync on plug-in", x: "72%", y: "48%", c: "#FF6FAE" }
      - { text: "Smaller cards, a page per player", x: "50%", y: "66%", c: "#FF6FAE" }
